name: Update download coverage proof

on:
  push:
    branches: [test/7175-update-download-coverage]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: storytold/craft-common-actions/actions/install-apt-packages@main
        with:
          packages: >-
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libasound2-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev
            libgl1-mesa-dev mesa-vulkan-drivers
      - run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - uses: step-security/taiki-e-install-action@76747d22a7567cc4438546a84f11bdf18e670ab8
        with:
          tool: cargo-llvm-cov,cargo-nextest@0.9.150
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e
        with:
          shared-key: update-download-coverage-7175
          save-if: "true"
      - name: Verify the archive and exercise the failure guards
        shell: bash
        run: |
          set -euo pipefail
          source <(cargo llvm-cov show-env --sh)
          export LLVM_PROFILE_FILE="$RUNNER_TEMP/profiles/updates-%p-%m.profraw"
          mkdir -p "$RUNNER_TEMP/profiles" "$RUNNER_TEMP/relocated"

          filter='test(=updates::a_newer_release_is_offered_for_download)'
          file=crates/ui-egui/tests/it/updates.rs
          cargo nextest run --locked -p pdfcraft-ui-egui --test it -E 'test(/^updates::/)' --failure-output final
          cargo nextest archive --locked -p pdfcraft-ui-egui --test it --archive-file "$RUNNER_TEMP/updates.tar.zst"
          cargo nextest run --archive-file "$RUNNER_TEMP/updates.tar.zst" --extract-to "$RUNNER_TEMP/relocated" -E 'test(/^updates::/)' --failure-output final
          test -z "$(find "$RUNNER_TEMP/relocated" -name .rustc_info.json -print -quit)"
          test -z "$(find "$RUNNER_TEMP/relocated" -name 'update-download-test' -print -quit)"
          find "$RUNNER_TEMP/profiles" -name '*.profraw' -size +0c -print -quit | grep -q .

          echo 'Development self-update opt-in is removed only for the child:'
          CRAFT_UPDATE_DEV=1 cargo nextest run --archive-file "$RUNNER_TEMP/updates.tar.zst" \
            --extract-to "$RUNNER_TEMP/relocated" --extract-overwrite -E "$filter" --failure-output final

          cp "$file" "$RUNNER_TEMP/original-updates.rs"
          check_failure() {
            local name="$1" expected="$2"
            local dir="$RUNNER_TEMP/$name"
            mkdir -p "$dir"
            cargo nextest archive --locked -p pdfcraft-ui-egui --test it --archive-file "$dir/updates.tar.zst"
            local result=0
            cargo nextest run --archive-file "$dir/updates.tar.zst" --extract-to "$dir/extracted" \
              -E "$filter" --failure-output final > "$dir/run.log" 2>&1 || result=$?
            cat "$dir/run.log"
            test "$result" -eq 100
            grep -Fq "$expected" "$dir/run.log"
            test -z "$(find "$dir/extracted" -name 'update-download-test' -print -quit)"
            cp "$RUNNER_TEMP/original-updates.rs" "$file"
          }
          for case in missing-marker missing-child broken-assertion; do
            mkdir -p "$RUNNER_TEMP/$case/extracted"
            python3 - "$file" "$case" <<'PYTHON'
          from pathlib import Path
          import sys
          path, case = Path(sys.argv[1]), sys.argv[2]
          original, replacement = {
              'missing-marker': ('.rustc_info.json', '.not-cargo'),
              'missing-child': ('--exact", "updates::a_newer_release_is_offered_for_download', '--exact", "updates::missing_child'),
              'broken-assertion': ('get_by_label("DOWNLOAD")', 'get_by_label("MISSING DOWNLOAD CONTROL")'),
          }[case]
          text = path.read_text()
          assert text.count(original) == 1
          path.write_text(text.replace(original, replacement))
          PYTHON
            case "$case" in
              missing-marker) check_failure "$case" 'the fixture must be detected as a Cargo build' ;;
              missing-child) check_failure "$case" 'contains("1 passed")' ;;
              broken-assertion) check_failure "$case" 'label: "MISSING DOWNLOAD CONTROL"' ;;
            esac
          done
          cargo fmt --all -- --check
          git diff --exit-code
